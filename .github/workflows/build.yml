name: Build student deliverables

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/build.yml"
      - "scripts/build_notebooks.py"
      - "scripts/build_report.py"
      - "scripts/build_slides.py"
      - "docs/rapport.md"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document dependencies
        run: python -m pip install --upgrade nbformat python-docx python-pptx
      - name: Generate four notebooks and editable documents
        run: |
          python scripts/build_notebooks.py
          python scripts/build_report.py
          python scripts/build_slides.py
          python scripts/check_project.py
      - name: Install PDF converter
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq libreoffice-writer libreoffice-impress
      - name: Export documents to PDF
        run: |
          libreoffice -env:UserInstallation=file:///tmp/scenesense_lo --headless --convert-to pdf --outdir docs docs/SceneSense_rapport.docx
          libreoffice -env:UserInstallation=file:///tmp/scenesense_lo2 --headless --convert-to pdf --outdir slides slides/SceneSense_presentation.pptx
          test -s docs/SceneSense_rapport.pdf
          test -s slides/SceneSense_presentation.pdf
      - name: Commit the produced files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notebooks/*.ipynb docs/SceneSense_rapport.docx docs/SceneSense_rapport.pdf slides/SceneSense_presentation.pptx slides/SceneSense_presentation.pdf
          if ! git diff --cached --quiet; then
            git commit -m "Generate notebooks, report and presentation"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
